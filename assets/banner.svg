<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b0d"/>
      <stop offset="1" stop-color="#141418"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ff5fa2" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#7a4dff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="1" stop-color="#ffb36b"/>
    </linearGradient>
    <style>
      .h { font: 800 76px 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #ffffff; letter-spacing: -2px; }
      .s { font: 500 24px 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #c9c9cf; }
      .t { font: 600 14px 'Inter', 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8d8d96; letter-spacing: 3px; }
      .dot { animation: pulse 2s ease-in-out infinite; transform-origin: 74px 270px; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    </style>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="18" fill="url(#glow)"/>
  <text x="64" y="86" class="t">UI/UX · PRODUCT DESIGN · CREATIVE DEV</text>
  <text x="62" y="172" class="h">M. Usama</text>
  <rect x="64" y="192" width="120" height="4" rx="2" fill="url(#accent)"/>
  <text x="64" y="236" class="s">Designing digital products across fintech, investing &amp; health tech.</text>
  <circle class="dot" cx="74" cy="270" r="6" fill="#22c55e"/>
  <text x="90" y="276" class="t" style="letter-spacing:1.5px;fill:#d7d7dc">AVAILABLE FOR NEW PROJECTS  ·  KARACHI, PAKISTAN</text>
  <g opacity="0.9" transform="translate(1000 70)">
    <circle cx="90" cy="90" r="88" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="90" cy="90" r="58" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-dasharray="4 6"/>
    <circle cx="90" cy="90" r="5" fill="url(#accent)"/>
    <path d="M90 2 V40 M90 140 V178 M2 90 H40 M140 90 H178" stroke="#ffffff" stroke-opacity="0.25"/>
  </g>
</svg>
